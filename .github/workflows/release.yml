name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: aarch64
          - target: x86_64-apple-darwin
            name: x64
          - target: universal-apple-darwin
            name: universal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build Tauri Bundle
        run: bun run tauri build --target ${{ matrix.target }}

      - name: Locate & Rename macOS Artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          find src-tauri/target -name "*.dmg" -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}-dmg
          path: artifacts/*.dmg

  build-windows:
    name: Build Windows (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            name: x64
          - target: aarch64-pc-windows-msvc
            name: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build Tauri Bundle
        run: bun run tauri build --target ${{ matrix.target }}

      - name: Locate & Collect Windows Artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.zip" \) -exec cp {} artifacts/ \; || true
          # Also package standalone exe if installer is absent
          if [ -f "src-tauri/target/${{ matrix.target }}/release/antigravity-tokens.exe" ]; then
            cp "src-tauri/target/${{ matrix.target }}/release/antigravity-tokens.exe" "artifacts/AntigravityTokens_${{ matrix.name }}.exe"
          fi
          ls -la artifacts/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.name }}
          path: artifacts/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: List Release Files
        run: |
          echo "=== Collected Release Binaries ==="
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
