name: Release Build

on:
  release:
    types: [published]
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag / Version (e.g. v1.0.1 or 1.0.1)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release Context
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version_info.outputs.tag }}
      version: ${{ steps.version_info.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve Release Tag & Version
        id: version_info
        shell: bash
        run: |
          RAW_TAG=""
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW_TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ inputs.tag_name }}"
            if [ -z "$RAW_TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
              RAW_TAG="${{ github.ref_name }}"
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            RAW_TAG="${{ github.ref_name }}"
          fi

          echo "Detected Raw Input Tag: '$RAW_TAG'"
          bun scripts/set-version.mjs --parse "$RAW_TAG" --github-output

  build-macos:
    name: Build macOS (${{ matrix.target }})
    needs: [prepare]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: aarch64
          - target: x86_64-apple-darwin
            name: x64
          - target: universal-apple-darwin
            name: universal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Synchronize Version
        run: |
          bun scripts/set-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build Tauri Bundle
        run: bun run tauri build --target ${{ matrix.target }}

      - name: Locate & Collect macOS Artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          find src-tauri/target -name "*.dmg" -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}-dmg
          path: artifacts/*.dmg
          if-no-files-found: warn

  build-windows:
    name: Build Windows (${{ matrix.target }})
    needs: [prepare]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            name: x64
          - target: aarch64-pc-windows-msvc
            name: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target == 'aarch64-pc-windows-msvc' && 'x64_arm64' || 'x64' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Synchronize Version
        shell: bash
        run: |
          bun scripts/set-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build Tauri Bundle
        run: bun run tauri build --target ${{ matrix.target }} --bundles nsis

      - name: Locate & Collect Windows Artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          # Collect bundled NSIS installers and zip packages
          find src-tauri/target -type f \( -name "*-setup.exe" -o -name "*.msi" -o -name "*.zip" \) -not -name "antigravity-tokens.exe" -exec cp {} artifacts/ \; 2>/dev/null || true

          # Also collect standalone portable executable
          STANDALONE_EXE="src-tauri/target/${{ matrix.target }}/release/antigravity-tokens.exe"
          if [ -f "$STANDALONE_EXE" ]; then
            cp "$STANDALONE_EXE" "artifacts/AntigravityTokens_${{ needs.prepare.outputs.version }}_${{ matrix.name }}.exe"
          elif [ -f "src-tauri/target/release/antigravity-tokens.exe" ]; then
            cp "src-tauri/target/release/antigravity-tokens.exe" "artifacts/AntigravityTokens_${{ needs.prepare.outputs.version }}_${{ matrix.name }}.exe"
          fi
          ls -la artifacts/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    needs: [prepare, build-macos, build-windows]
    if: always() && !cancelled() && needs.prepare.result == 'success' && (needs.build-macos.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Verify & List Release Files
        run: |
          echo "=== Collected Release Binaries for ${{ needs.prepare.outputs.tag }} ==="
          ls -la release-assets/
          if [ -z "$(ls -A release-assets/ 2>/dev/null)" ]; then
            echo "::error::No build artifacts found in release-assets/ to upload!"
            exit 1
          fi

      - name: Publish GitHub Release via GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          TITLE="Antigravity Tokens $TAG"

          ASSET_ARGS=()
          for file in release-assets/*; do
            if [ -f "$file" ]; then
              ASSET_ARGS+=("$file")
            fi
          done

          echo "Publishing release for tag: $TAG with ${#ASSET_ARGS[@]} assets"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets..."
            gh release upload "$TAG" "${ASSET_ARGS[@]}" --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "${ASSET_ARGS[@]}" \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --generate-notes
          fi
